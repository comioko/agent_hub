server:
  port: 8080

spring:
  application:
    name: agenthub-backend

  datasource:
    url: jdbc:mysql://localhost:3306/agent_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234567890
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.agenthub.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:agenthub-secret-key-change-in-production-2024}
  expiration: 86400000

openai:
  api:
    key: ${OPENAI_API_KEY:}
    base: ${OPENAI_API_BASE:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-3.5-turbo}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    base: ${ANTHROPIC_API_BASE:https://api.anthropic.com}
  model: ${ANTHROPIC_MODEL:claude-3-haiku-20240307}

minimax:
  api:
    key: ${MINIMAX_API_KEY:}
    base: https://mimimax.cn/v1
  model: MiniMax-M2.7-highspeed

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    base: ${DEEPSEEK_API_BASE:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

logging:
  level:
    com.agenthub: DEBUG
    org.springframework.security: DEBUG
